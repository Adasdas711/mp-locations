<style>
body{background:#20242c;color:#f1f4fa;font:14px/1.5 system-ui}h2{margin:0 0 8px}label{display:block;margin:16px 0 6px}select,button{background:#303745;color:inherit;border:1px solid #586579;border-radius:8px;padding:9px;max-width:100%;font:inherit}select{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}#appearanceMessage{min-height:24px;margin-top:12px}small{color:#b9c4d6}input{max-width:100%}
</style>
<h2>Themes and icons</h2><small>Choose themes and icon sets independently. Preferences are saved in this browser.</small>
<label for="appearanceTheme">Color theme</label><select id="appearanceTheme"></select>
<label for="appearanceIcons">Interface icons</label><select id="appearanceIcons"></select>
<div class="actions"><button id="appearanceReset">System appearance</button></div>
<label for="appearanceImport">Install your own JSON collection</label><input id="appearanceImport" type="file" accept=".json,application/json">
<small>Format: themes and iconThemes. IDs must start with palace.appearance. See catalog.json for an example.</small>
<div class="actions"><button id="appearanceRemoveCustom">Remove imported collections</button><button id="appearanceExport">Show example JSON</button></div>
<p id="appearanceMessage" role="status"></p>
